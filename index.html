<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini CRM - Freelance</title>
    <!-- Memanggil mesin Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 text-white p-6 flex flex-col shadow-xl">
        <h2 class="text-xl font-bold mb-6 pb-2 border-b border-slate-600 text-slate-100">CRM Workspace</h2>
        <nav class="flex-1">
            <ul class="space-y-3">
                <li><a href="#" class="block p-2 rounded bg-slate-700 text-white font-medium">Daftar Proyek</a></li>
                <li><a href="#" class="block p-2 rounded text-slate-300 hover:bg-slate-700 hover:text-white transition">User (Pelanggan)</a></li>
                <li><a href="#" class="block p-2 rounded text-slate-300 hover:bg-slate-700 hover:text-white transition">Invoice & Tagihan</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Area Konten Utama -->
    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Halo, Dhafin!</h1>
            <button id="btn-tambah" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-semibold shadow-md transition transform hover:-translate-y-0.5">
                + Proyek Baru
            </button>
        </header>
        
        <section id="project-list" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 min-h-[300px]">
            <!-- Nanti data proyek dirender ke sini oleh JavaScript -->
            <p class="text-slate-500 italic">Belum ada proyek yang aktif saat ini.</p>
        </section>
    </main>
    
    <!-- File JS tetap tidak berubah -->
    <script src="app.js"></script>
</body>
