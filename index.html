<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini CRM - Freelance</title>
    <!-- Memanggil mesin Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 text-white p-6 flex flex-col shadow-xl">
        <h2 class="text-xl font-bold mb-6 pb-2 border-b border-slate-600 text-slate-100">CRM Workspace</h2>
        <nav class="flex-1">
            <ul class="space-y-3">
                <li><a href="#" class="block p-2 rounded bg-slate-700 text-white font-medium">Daftar Proyek</a></li>
                <li><a href="#" class="block p-2 rounded text-slate-300 hover:bg-slate-700 hover:text-white transition">User (Pelanggan)</a></li>
                <li><a href="#" class="block p-2 rounded text-slate-300 hover:bg-slate-700 hover:text-white transition">Invoice & Tagihan</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Area Konten Utama -->
    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Halo, Dhafin!</h1>
            <button id="btn-tambah" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-semibold shadow-md transition transform hover:-translate-y-0.5">
                + Proyek Baru
            </button>
        </header>
        
        <section id="project-list" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 min-h-[300px]">
            <!-- Nanti data proyek dirender ke sini oleh JavaScript -->
            <p class="text-slate-500 italic">Belum ada proyek yang aktif saat ini.</p>
        </section>
    </main>


    <!-- Modal Tambah Proyek -->
<div id="modal-tambah" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="text-lg font-bold text-slate-800">Tambah Proyek Baru</h3>
            <button id="btn-tutup-modal" class="text-slate-400 hover:text-red-500 font-bold text-xl">&times;</button>
        </div>
        <form id="form-proyek" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Proyek</label>
                <input type="text" id="input-nama" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama User (Pelanggan)</label>
                <input type="text" id="input-user" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Harga (Rp)</label>
                <input type="text" id="input-harga" placeholder="Contoh: Rp 1.000.000" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>
            <div class="pt-4">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">Simpan Proyek</button>
            </div>
        </form>
    </div>
</div>
    
    <!-- File JS tetap tidak berubah -->
    <script src="app.js"></script>
</body>
